name: Apex Check

on:
  push:
    branches:
      - apex-foundation-1.0
  pull_request:
    branches:
      - apex-foundation-1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, TypeScript and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Apex verification
        run: npm run apex:check
